name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # 写真(ホットペッパー グルメ)の鮮度維持のため、1日1回 再フェッチ→再ビルド→再デプロイする。
  # 15:30 UTC = 翌 00:30 JST。
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 店舗写真(ホットペッパー グルメ)を取得し data/photos.generated.json を生成する。
      # HOTPEPPER_API_KEY(Secret)が未設定でも空マップで正常終了し、ビルドは通る。
      - name: Fetch venue photos (Hot Pepper)
        run: node scripts/fetch-photos.js
        env:
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}

      - name: Build static site
        run: node scripts/build.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
